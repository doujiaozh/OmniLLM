<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="manifest" href="/web/manifest.json">
    <meta name="theme-color" content="#238636">
    <meta charset="UTF-8">
    <title>OmniLLM - 极客大模型</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; margin: 0; padding: 20px; }
        #chat-box { width: 100%; max-width: 800px; height: 500px; border: 1px solid #30363d; border-radius: 6px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #161b22; }
        .msg { margin-bottom: 15px; }
        .user { color: #58a6ff; }
        .ai { color: #3fb950; }
        #input-area { max-width: 800px; display: flex; }
        input[type="text"] { flex: 1; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px 0 0 4px; outline: none; font-family: monospace; }
        button { padding: 10px 20px; background: #238636; border: 1px solid #2ea043; color: white; border-radius: 0 4px 4px 0; cursor: pointer; font-family: monospace; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <h2>OmniLLM // 极客底层对话引擎</h2>
    <div id="chat-box">
        <div class="msg ai">OmniLLM 已启动。底层引擎就绪，请输入你的指令。</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="输入指令，按回车发送..." autocomplete="off">
        <button onclick="sendMessage()">发送</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            
            // 打印用户消息
            chatBox.innerHTML += `<div class="msg user">> ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 模拟底层推理（延迟回复）
            setTimeout(() => {
                const reply = `收到指令: "${text}"。当前运行于极客纯前端演示环境，后续将接入底层 Core 引擎。`;
                chatBox.innerHTML += `<div class="msg ai">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
